<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html
    PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:h="http://xmlns.jcp.org/jsf/html"
    xmlns:f="http://xmlns.jcp.org/jsf/core">
<h:head>
    <title>Liste des produits</title>
</h:head>
<h:body>
    <h1>Liste des produits</h1>

    <h:messages globalOnly="true" showDetail="true" showSummary="true" style="color:green; font-weight:bold;" />

    <h:form>
        <h:commandButton value="Ajouter un produit" action="ajouterProduit?faces-redirect=true" />
    </h:form>

    <br />

    <h:dataTable value="#{produitBean.listeProduits}" var="p" border="1" cellpadding="5">
        <h:column>
            <f:facet name="header">Code</f:facet>
            #{p.code}
        </h:column>
        <h:column>
            <f:facet name="header">Description</f:facet>
            #{p.description}
        </h:column>
        <h:column>
            <f:facet name="header">Quantité</f:facet>
            #{p.quantite}
        </h:column>
        <h:column>
            <f:facet name="header">Prix</f:facet>
            #{p.prix}
        </h:column>
    </h:dataTable>

</h:body>

</html>
